# Avisa por mail (el aviso de GitHub de "Run failed") cuando en las últimas 6 horas algún usuario
# tuvo un error en ADN Obras. Solo consulta CUÁNTOS errores hubo, nunca el detalle (este repositorio
# es público): el detalle se revisa en la base, en la tabla errores_app.
name: Errores en ADN Obras

on:
  schedule:
    - cron: "41 */6 * * *" # cada 6 horas
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Contar errores de las últimas 6 horas
        run: |
          desde=$(date -u -d '6 hours ago 5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          resp=$(curl -sS --max-time 60 -X POST \
            "https://xnyleewcwrriodkaklqo.supabase.co/rest/v1/rpc/contar_errores" \
            -H "apikey: sb_publishable_AXWyRi8sy_ZoSA7oTkHRUQ_YrqASf5a" \
            -H "Content-Type: application/json" \
            -d "{\"p_desde\":\"$desde\"}")
          echo "Respuesta: $resp"
          cantidad=$(echo "$resp" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["cantidad"] if isinstance(d,list) and d else -1)')
          usuarios=$(echo "$resp" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["usuarios"] if isinstance(d,list) and d else 0)')
          if [ "$cantidad" = "-1" ]; then
            echo "::error::No se pudo consultar la base de ADN Obras."
            exit 1
          fi
          if [ "$cantidad" -gt 0 ]; then
            echo "## Hubo $cantidad errores en ADN Obras (a $usuarios usuarios con cuenta) en las últimas 6 horas" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Hubo $cantidad errores en ADN Obras en las últimas 6 horas. Pedile a Claude que los revise."
            exit 1
          fi
          echo "Sin errores en las últimas 6 horas."
