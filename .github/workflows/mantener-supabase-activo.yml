# Supabase pausa los proyectos gratuitos después de unos días sin consultas.
# Este flujo hace una consulta liviana a cada base todos los días para que nunca se pausen.
# Las claves son las públicas (las mismas que usan las apps en el navegador).
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 9 * * *" # todos los días, 06:17 de Argentina
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Panel de ADN
        run: |
          curl -fsS -o /dev/null -w "Panel ADN: HTTP %{http_code}\n" \
            "https://jjbpkdthnokfkivifpkr.supabase.co/rest/v1/planes?select=codigo&limit=1" \
            -H "apikey: sb_publishable_rKocUz3tE3obSdQhwmh9XA_qralPW_1"
      - name: Hub de Obras
        run: |
          curl -fsS -o /dev/null -w "Hub Obras: HTTP %{http_code}\n" \
            "https://xnyleewcwrriodkaklqo.supabase.co/rest/v1/clubes?select=id&limit=1" \
            -H "apikey: sb_publishable_AXWyRi8sy_ZoSA7oTkHRUQ_YrqASf5a"
